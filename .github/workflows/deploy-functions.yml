name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: skxljgnpjmnekvecpfjd
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          supabase functions deploy mcp-server --project-ref "$PROJECT_ID"
          supabase functions deploy chat --project-ref "$PROJECT_ID"
      - name: Skip if token missing
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "Add GitHub secret SUPABASE_ACCESS_TOKEN (Account > Access Tokens)"
          echo "Until then, deploy locally: npx supabase functions deploy --project-ref $PROJECT_ID"
